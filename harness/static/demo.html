<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guardian · Card states</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  .demo { max-width: 1900px; margin: 0 auto; padding: 32px 24px 64px; }
  .demo > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 28px; }
  .demo h1 { margin: 0; font: 700 36px/1.2 var(--font-head); }
  .demo > header p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 32px 28px; }
  .state { margin: 0; }
  .state > figcaption { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font: 600 20px/1.2 var(--font-head); color: var(--ink-2); }
  .state > figcaption code { font: 600 16px/1 ui-monospace, monospace; color: var(--muted); }
  /* each frame is the size of the live right-hand pane */
  .frame { height: 640px; display: flex; flex-direction: column; padding: 18px; border-radius: 30px; background: radial-gradient(700px 400px at 0% 0%, #13213b 0%, var(--screen) 60%); box-shadow: inset 0 0 0 1px #ffffff12, 0 30px 60px -30px #000; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .frame { height: auto; min-height: 600px; } }
</style>
</head>
<body>
<main class="demo">
  <header>
    <h1>Guardian card states</h1>
    <p>Fake data, real renderer (static/cards.js). For screenshots and the demo video.</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script src="/static/cards.js"></script>
<script src="/static/demo.js"></script>
</body>
</html>
