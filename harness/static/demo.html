<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guardian · Screen states</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  .demo { max-width: 2000px; margin: 0 auto; padding: 32px 24px 64px; color: var(--page-ink); }
  .demo > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 28px; }
  .demo h1 { margin: 0; font: 700 36px/1.2 var(--font-head); }
  .demo > header p { margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 40px 32px; }
  .state { margin: 0; }
  .state > figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; font: 600 22px/1.2 var(--font-head); }
  .state > figcaption a { color: #0b5cad; font: 600 18px/1.2 var(--font-body); }
  /* each state is the real 1240px device, scaled down to fit the grid */
  .shrink { --s: .47; width: calc(1240px * var(--s)); height: calc(880px * var(--s)); }
  .shrink > .product { width: 1240px; transform: scale(var(--s)); transform-origin: 0 0; }
  .solo .stage { padding-top: 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/cards.js"></script>
<script src="/static/demo.js"></script>
</body>
</html>
